    <!-- FOUC Prevention Script (Section 6.1) -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', '-apple-system', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#EFF6FF',
                100: '#DBEAFE',
                200: '#BFDBFE',
                500: '#3B82F6',
                600: '#1A56DB',
                700: '#1E429F',
                800: '#1E3A8A',
              },
              dark: {
                bg: '#0F1218',
                surface: '#1E222B',
                muted: '#161A22',
                border: '#2D3748',
              }
            },
            boxShadow: {
              card: '0 1px 3px 0 rgb(0 0 0 / 0.05)',
              'card-hover': '0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04)',
              'card-dark-hover': '0 8px 24px -4px rgba(0, 0, 0, 0.45)',
            }
          }
        }
      }
    </script>
    <style>
      body { 
        font-family: 'Plus Jakarta Sans', Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background-color: #F8FAFC;
        color: #0F172A;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        transition: background-color 200ms ease, color 200ms ease;
      }
      
      .dark body {
        background-color: #0F1218;
        color: #F8FAFC;
      }
      
      @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 250ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      
      /* Subtle custom scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #F1F5F9; }
      ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
      
      .dark ::-webkit-scrollbar-track { background: #161A22; }
      .dark ::-webkit-scrollbar-thumb { background: #334155; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #475569; }

      /* === Smooth Tactile Drag & Drop (Organize & Merge PDF) === */
      .drag-card {
        transition: transform 180ms cubic-bezier(0.2, 0, 0, 1), box-shadow 180ms ease, border-color 180ms ease;
        will-change: transform;
        touch-action: none;
      }
      .drag-target-indicator {
        transform: scale(1.05) translateY(-3px) !important;
        border-color: #3B82F6 !important;
        box-shadow: 0 14px 28px -6px rgba(59, 130, 246, 0.35), 0 0 0 2px #3B82F6 !important;
        z-index: 10 !important;
      }
      .drag-floating-card {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 99999;
        opacity: 1 !important;
        will-change: transform;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45), 0 0 0 2px #3B82F6;
      }
    </style>
