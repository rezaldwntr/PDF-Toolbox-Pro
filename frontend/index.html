    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Segoe UI', 'Roboto', 'sans-serif'],
              display: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'sans-serif'],
              mono: ['Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
            colors: {
                rios: {
                    primary: '#007aff',
                    primaryDark: '#0a84ff',
                    desktopLight: '#f0f0f5',
                    desktopDark: '#141414',
                    windowLight: 'rgba(255, 255, 255, 0.65)',
                    windowDark: 'rgba(30, 30, 30, 0.65)',
                    menuLight: 'rgba(255, 255, 255, 0.35)',
                    menuDark: 'rgba(30, 30, 30, 0.35)',
                    textLight: '#1d1d1f',
                    textDark: '#f5f5f7',
                    mutedLight: '#86868b',
                    mutedDark: '#a1a1a6',
                    borderGlass: 'rgba(255, 255, 255, 0.2)',
                    borderGlassDark: 'rgba(255, 255, 255, 0.1)',
                    close: '#ff5f56',
                    minimize: '#ffbd2e',
                    maximize: '#27c93f',
                    dockLight: 'rgba(255, 255, 255, 0.4)',
                    dockDark: 'rgba(0, 0, 0, 0.4)',
                    selection: 'rgba(0, 122, 255, 0.3)',
                }
            },
            spacing: {
                'menu-height': '28px',
                'dock-padding': '8px',
            },
            borderRadius: {
                'squircle': '22.5%',
            },
            boxShadow: {
                'window-inactive': '0 10px 30px rgba(0,0,0,0.15)',
                'window-active': '0 20px 50px rgba(0,0,0,0.3)',
            }
          }
        }
      }
    </script>
    <style>
      /* Base OS Canvas */
      body, html, #root { 
          height: 100%;
          width: 100%;
      }
      body {
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
          background: radial-gradient(circle at 40% 30%, #3a3022 0%, #171512 40%, #0d0c0a 100%);
          color: #f5f5f7;
          overflow: hidden; /* Desktop OS has no body scroll */
          margin: 0;
          padding: 0;
          height: 100vh;
          width: 100vw;
          user-select: none; /* Make it feel like an OS */
      }
      
      .light body {
          background: radial-gradient(circle at 40% 30%, #e6dccf 0%, #f5f0eb 40%, #ffffff 100%);
          color: #1d1d1f;
      }
      
      /* Utilities for typography */
      .tracking-menu { letter-spacing: -0.01em; }
      .tracking-display { letter-spacing: -0.02em; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .animate-fade-in { animation: fadeIn 300ms ease-out forwards; }
      @keyframes popIn { 
          0% { opacity: 0; transform: scale(0.95); } 
          100% { opacity: 1; transform: scale(1); } 
      }
      .animate-pop-in { animation: popIn 200ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      
      /* Custom Scrollbar for windows */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(134, 134, 139, 0.3); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(134, 134, 139, 0.5); }
    </style>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
