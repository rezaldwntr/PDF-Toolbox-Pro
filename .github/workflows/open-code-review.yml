name: OpenCodeReview Automated PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: Alibaba OpenCodeReview
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@main
        with:
          llm_url: ${{ secrets.OCR_LLM_URL || 'https://api.openai.com/v1' }}
          llm_auth_token: ${{ secrets.OCR_LLM_TOKEN || secrets.OPENAI_API_KEY }}
          llm_model: ${{ secrets.OCR_LLM_MODEL || 'gpt-4o-mini' }}
          llm_use_anthropic: false
          language: Indonesian
          github_token: ${{ secrets.GITHUB_TOKEN }}
